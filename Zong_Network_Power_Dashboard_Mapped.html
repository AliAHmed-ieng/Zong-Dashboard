<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zong | Network &amp; Power Intelligence</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet"><style>:root{--pink:#e6007e;--pink2:#ff4fa8;--lime:#8dc63f;--limed:#5fa11f;--plum:#3a0f2e;--ink:#2b1b26;--muted:#85707d;--bg:#f4eff3;--card:#fff;--line:#eadde6}

<script src="./dashboard-config.js"></script><script src="./github-pages-data.js"></script><script>
let DATA=null;const $=id=>document.getElementById(id);

 ...[1,2,3].map(i=>({cat:'Rectifiers',name:'Huawei '+i,kw:`Huawei Rect-${i} AC-Kw`,amp:[`Huawei Rect-${i} DC Amp`],pct:`Huawei ${i} Load`})),
 ...[1,2].map(i=>({cat:'UPS',name:'UPS '+i,kw:`UPS ${i} KW`,amp:L3(`UPS-${i} Amp L`),pct:`UPS ${i} Load%`})),
 {cat:'HVAC',name:'HVAC',kw:'HVAC (Kw)',amp:L3('HVAC AMP L')}]},

 {cat:'Rectifiers',name:'Rectifier total',kw:'Rect load KW',amp:L3('Rect-Amp-L')}]}};

};
const headerMap=headers=>{const m={};(headers||[]).forEach(h=>{if(h!=null)m[norm(h)]=h});return m};
const getHeader=(headers,names)=>{const m=headerMap(headers);for(const n of names||[]){if(m[norm(n)])return m[norm(n)]}return null};
function detailFuelRows(site){
 const cfg=FUEL_DETAIL[site];if(!cfg||!DATA.fuelSheets)return [];
 const rows=[];
 for(const name of cfg.sheets){const sh=Object.keys(DATA.fuelSheets).find(k=>norm(k)===norm(name));if(!sh)continue;
  const src=DATA.fuelSheets[sh]||{},headers=src.headers||[],hm=headerMap(headers);
  for(const original of (src.rows||[])){const r={...original,_fuelSheet:sh};
   let dh=getHeader(headers,['Date']),yh=getHeader(headers,['Year']),mh=getHeader(headers,['Month']);if(dh&&r[dh]!=null){const dt=new Date(r[dh]);if(!isNaN(dt)){if(!yh||r[yh]==null||r[yh]==='')r.Year=dt.getFullYear();if(!mh||r[mh]==null||r[mh]==='')r.Month=MON[dt.getMonth()];}}
   r._consumeHeader=getHeader(headers,cfg.consume);
   r._dgFuelHeaders=cfg.dgFuel.map(n=>getHeader(headers,[n])).filter(Boolean);

function fuelDetailStats(site){

 if(!rows.length)return [];

 // Prefer the primary consumption field on the site's main fuel sheet.

 let kpis=[];
 if(primary.length){
  const vals=primary.map(r=>num(r[r._consumeHeader])).filter(v=>v!=null);
  if(vals.length)kpis.push({l:'Avg fuel consumption',v:avg(vals),u:'L'});
 }
 const dgHeaders=[...new Set(rows.flatMap(r=>r._dgFuelHeaders||[]))];
 // Dalmia has no overall consumption column: sum DG-1 + DG-2 per record before averaging.
 if(!primary.length&&dgHeaders.length){
  const totals=rows.map(r=>{const vals=dgHeaders.map(h=>num(r[h])).filter(v=>v!=null);return vals.length?sum(vals):null}).filter(v=>v!=null);
  if(totals.length)kpis.push({l:'Avg fuel consumption',v:avg(totals),u:'L'});
 }
 for(const h of dgHeaders){const vals=rows.map(r=>num(r[h])).filter(v=>v!=null);if(vals.length)kpis.push({l:h.replace(/\s*\(L\)/i,'').replace(/fuel\s+(consume|consumption).*/i,'fuel').trim(),v:avg(vals),u:'L'});}

/* ---------- data prep ---------- */
function tsOf(r){let y=num(r.Year),m=r.Month,d=r.Date,mi=-1;
 if(typeof m==='number')mi=m-1;else if(m!=null){mi=MON.findIndex(x=>x.toLowerCase()===String(m).slice(0,3).toLowerCase());if(mi<0&&num(m)!=null)mi=num(m)-1}
 let dn=num(d);
 if(dn==null||dn>31||y==null||mi<0){let p=Date.parse(d instanceof Date?d:String(d));if(!isFinite(p))return null;let dt=new Date(p);y=dt.getFullYear();mi=dt.getMonth();dn=dt.getDate()}
 let h=0;if(r.Time!=null){let mm=String(r.Time).match(/(\d{1,2}):(\d{2})/);if(mm)h=+mm[1]}
 return{t:Date.UTC(y,mi,dn,h),y,m:mi,d:dn,h}}
function stamp(rows){let o=[];for(const r of rows){let t=tsOf(r);if(t){r._t=t.t;r._y=t.y;r._m=t.m;r._d=t.d;r._h=t.h;o.push(r)}}return o.sort((a,b)=>a._t-b._t)}

 if(I.telco&&I.non)L.push({id:'cB',title:'Telco vs Non-telco',fn:el=>{let ss=[{name:'Telco',color:P.pink,vals:tel},{name:'Non-telco',color:P.lime,vals:non}];setHR(el,legend(ss));lineChart(el,{series:ss,labels:lab,short:sh,unit:'kW'})}});
 if(I.pue)L.push({id:'cC',title:'PUE efficiency',fn:el=>{setHR(el,`<span>avg <b>${fmt(avg(pue),2)}</b></span>`);lineChart(el,{series:[{name:'PUE',color:P.plum,vals:pue}],labels:lab,short:sh,area:true,avgLine:true})}});
 let rk=I.items.filter(it=>it.cat!=='Transformer').map(it=>{let v=rows.map(r=>iv(it,r));return{label:it.name,val:avg(v),min:st(v,'min'),max:st(v,'max'),color:col(it.cat),dot:null}}).filter(x=>x.val!=null).sort((a,b)=>b.val-a.val);

 if(tf)L.push({id:'cI',title:'Monthly average',fn:el=>{let all=filt(prep(S.site),false,false),by=new Map();all.forEach(r=>{let v=iv(tf,r),k=r._y*12+r._m;if(v!=null){if(!by.has(k))by.set(k,[]);by.get(k).push(v)}});let it=[...by.entries()].sort((a,b)=>a[0]-b[0]).slice(-12).map(([k,a])=>({label:MON[k%12]+' '+Math.floor(k/12),short:MON[k%12],val:avg(a),color:P.pink}));setHR(el,`<span><b>${ul()}</b></span>`);barChart(el,{items:it,zoom:true})}});

function renderFuel(){let site=S.site,F=FUEL[site];if(!F){$('kpis').innerHTML='';$('charts').innerHTML='<div class="card"><div class="nd" style="height:90px">No fuel data for this site</div></div>';return}
 let all=fuelRows(),hm={};all.length&&Object.keys(DATA.fuelStatus[0]||{}).forEach(h=>hm[norm(h)]=h);const H=n=>hm[norm(n)]||n;
 let [cap,dead,av,hr]=F.map(H),rows=filt(all),G=groups(rows),last=rows[rows.length-1]||{},lab=G.g.map(g=>g.label),sh=G.g.map(g=>g.short);
 let avS=series(G,r=>num(r[av])),hrS=series(G,r=>num(r[hr])),capV=num(last[cap]),avV=num(last[av]);
 let diffs=[];for(let i=1;i<avS.length;i++)diffs.push(avS[i]!=null&&avS[i-1]!=null?avS[i]-avS[i-1]:null);
 let use=diffs.filter(d=>d!=null&&d<0),refills=diffs.filter(d=>d!=null&&capV&&d>capV*.05).length;
 $('kpis').innerHTML=kpiHTML([{l:'Fuel now',v:avV,s:avS},{l:'Fuel level',v:capV?avV/capV*100:null,u:'%',d:1,s:avS.map(v=>v!=null&&capV?v/capV*100:null)},{l:'Backup time',v:num(last[hr]),u:'hrs',d:1,s:hrS},{l:'Tank capacity',v:capV},{l:'Dead fuel',v:num(last[dead])},{l:'Daily use',v:use.length?-avg(use):null,s:diffs.map(d=>d!=null&&d<0?-d:null)},{l:'Refills',v:refills,d:0},...fuelDetailStats(site)]);
 let L=[{id:'fA',title:'Available fuel',cls:'c2 t',fn:el=>{setHR(el,`<span>latest <b>${fmt(avV)}</b></span>`);lineChart(el,{series:[{name:'Available',color:P.pink,vals:avS}],labels:lab,short:sh,area:true,avgLine:true})}},
 {id:'fB',title:'Backup hours',fn:el=>{setHR(el,`<span>now <b>${fmt(num(last[hr]),1)} h</b></span>`);lineChart(el,{series:[{name:'Backup',color:P.lime,vals:hrS}],labels:lab,short:sh,area:true,unit:'h'})}},
 {id:'fC',title:'Tank level',fn:el=>{let p=capV?avV/capV:0;donut(el,{items:[{label:'Fuel',val:Math.max(0,avV||0),color:p<.25?P.pink:P.lime},{label:'Empty space',val:Math.max(0,(capV||0)-(avV||0)),color:'#efe3ea'}],big:fmt(p*100,0)+'%',small:'full'})}},
 {id:'fD',title:'Daily change',cls:'c2',fn:el=>{setHR(el,'<span><i style="background:#7dbb2f"></i>refill <i style="background:#e6007e;margin-left:6px"></i>used</span>');barChart(el,{items:diffs.map((d,i)=>({label:lab[i+1],short:sh[i+1],val:d,color:d>=0?P.lime:P.pink}))})}}];
 let lastAll=all[all.length-1]||{},sites=Object.keys(FUEL).map(s=>{let f=FUEL[s].map(H);return{s,hrs:num(lastAll[f[3]]),pct:num(lastAll[f[2]])/num(lastAll[f[0]])*100}});
 L.push({id:'fG',title:'Fuel used (cumulative)',cls:'c2',fn:el=>{let c=0,v=diffs.map(d=>{if(d!=null&&d<0)c-=d;return c});setHR(el,`<span>total <b>${fmt(c)}</b></span>`);lineChart(el,{series:[{name:'Used',color:P.plum,vals:v}],labels:lab.slice(1),short:sh.slice(1),area:true,min0:true})}},
 {id:'fE',title:'Backup hours by site',fn:el=>{setHR(el,'<span>latest</span>');hbars(el,sites.map(x=>({label:x.s,val:x.hrs,color:x.s===site?P.pink:P.lime})),{unit:' h'})}},
 {id:'fF',title:'Tank level by site',fn:el=>{setHR(el,'<span>latest</span>');hbars(el,sites.map(x=>({label:x.s,val:x.pct,color:x.s===site?P.pink:P.lime})),{unit:'%'})}});
 draw(L)}
/* ---------- init / io ---------- */
function toast(m){let t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function init(){}
const tip=$('tip');
document.addEventListener('mousemove',e=>{let t=e.target.closest&&e.target.closest('[data-tip]');if(!t||!t.getAttribute('data-tip')){tip.style.opacity=0;return}tip.innerHTML=t.getAttribute('data-tip');tip.style.opacity=1;tip.style.left=Math.max(60,Math.min(innerWidth-60,e.clientX))+'px';tip.style.top=e.clientY+'px'});
document.addEventListener('mouseleave',()=>tip.style.opacity=0);
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>DATA&&render(),160)});
$('exportBtn').addEventListener('click',()=>{if(!DATA)return;let rows,hs;if(S.view==='fuel'){rows=filt(fuelRows());hs=Object.keys((DATA.fuelStatus||[])[0]||{})}else if(S.site==='all'){let all=[];hs=['Location',...new Set(Object.values(DATA.sites).flatMap(s=>s.headers))];for(const site of Object.keys(DATA.sites))all.push(...filt(prep(site)).map(r=>Object.assign({Location:site},r)));rows=all}else{rows=filt(prep(S.site));hs=DATA.sites[S.site].headers}
 let q=v=>'"'+String(v??'').replace(/"/g,'""')+'"',csv=[hs.map(q).join(',')].concat(rows.map(r=>hs.map(h=>q(h==='Location'?r.Location:r[h])).join(','))).join('\r\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));a.download=(S.site==='all'?'all_locations':S.site)+(S.view==='fuel'?'_fuel':'_filtered')+'.csv';a.click();URL.revokeObjectURL(a.href)});
let XLSX_PROMISE=null; async function ensureXLSX(){if(window.XLSX)return;if(!XLSX_PROMISE)XLSX_PROMISE=new Promise((resolve,reject)=>{let s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';s.onload=resolve;s.onerror=()=>reject(Error('Could not load the workbook reader.'));document.head.appendChild(s)});await XLSX_PROMISE}
async function applyWorkbook(file,name,notify){await ensureXLSX();let book=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true}),next={sites:{},fuelStatus:[],fuelSheets:{}};
 for(let s of ['Korangi','Dalmia','Hyderabad','Quetta']){if(!book.Sheets[s])continue;let rows=XLSX.utils.sheet_to_json(book.Sheets[s],{defval:null,raw:false});next.sites[s]={headers:rows.length?Object.keys(rows[0]):[],rows}}
 if(book.Sheets['Fuel Status'])next.fuelStatus=XLSX.utils.sheet_to_json(book.Sheets['Fuel Status'],{defval:null,raw:false});
 for(const name of book.SheetNames){if(/fuel/i.test(name)&&!/^fuel status$/i.test(name)){const ws=book.Sheets[name];const rows=XLSX.utils.sheet_to_json(ws,{defval:null,raw:false});next.fuelSheets[name]={headers:rows.length?Object.keys(rows[0]):[],rows};}}
 if(!Object.keys(next.sites).length)throw Error('Could not find Korangi, Dalmia, Hyderabad or Quetta sheets.');applyDashboardData(next,name,notify)} function applyDashboardData(data,name,notify){if(!data||!data.sites||!Object.keys(data.sites).length)throw Error('Demo data does not contain site data.');DATA=data;S.year='';S.month='';S.quarter='';for(const s of Object.values(DATA.sites)){delete s._p;delete s._info;}delete DATA._fp;render();if(notify)toast('Loaded '+name)}
$('fileInput').addEventListener('change',async e=>{let f=e.target.files[0];if(!f)return;try{await applyWorkbook(f,f.name,true)}catch(err){console.error('Could not load workbook:',err);toast('Could not load workbook: '+err.message)}e.target.value=''});
async function refreshDashboardData(){return window.refreshGitHubWorkbook(applyWorkbook,toast)}init();refreshDashboardData();setInterval(refreshDashboardData,3000);
