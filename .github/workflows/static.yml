# Deploy the dashboard and versioned workbook from every release
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  trigger_release_deployment:
    if: github.event_name == 'release'
    permissions:
      contents: write
      actions: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create a unique Pages revision and queue deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          git checkout -B pages-deploy origin/main
          printf '%s\n' "$GITHUB_REF_NAME" > .pages-release-version
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .pages-release-version
          git commit -m "Trigger Pages deployment for release $GITHUB_REF_NAME"
          git push origin pages-deploy --force
          gh workflow run static.yml --repo "$GITHUB_REPOSITORY" --ref pages-deploy

  deploy:
    if: github.event_name != 'release'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Download versioned workbook
        id: backend
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          gh release download "$release_tag" --repo "$GITHUB_REPOSITORY" --pattern Backend.xlsm --dir .
          test -s Backend.xlsm
          cp Backend.xlsm "Backend-$release_tag.xlsm"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          sha256sum "Backend-$release_tag.xlsm"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify deployed workbook
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
          RELEASE_TAG: ${{ steps.backend.outputs.tag }}
        run: |
          url="${PAGES_URL%/}/Backend-${RELEASE_TAG}.xlsm"
          for attempt in {1..12}; do
            status="$(curl -sS -o /dev/null -w '%{http_code}' "$url")"
            if [[ "$status" == "200" ]]; then
              echo "Verified $url"
              exit 0
            fi
            echo "Attempt $attempt: Pages returned HTTP $status; retrying..."
            sleep 10
          done
          echo "Pages did not serve the workbook after deployment: $url" >&2
          exit 1
