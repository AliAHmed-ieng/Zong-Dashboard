name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  trigger_release_deployment:
    if: github.event_name == 'release'
    permissions:
      contents: write
      actions: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create a unique Pages revision and queue deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          git checkout -B pages-deploy origin/main
          printf '%s\n' "$GITHUB_REF_NAME" > .pages-release-version
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .pages-release-version
          git commit -m "Trigger Pages deployment for release $GITHUB_REF_NAME"
          git push origin pages-deploy --force
          gh workflow run static.yml --repo "$GITHUB_REPOSITORY" --ref pages-deploy

  deploy:
    if: github.event_name != 'release'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
