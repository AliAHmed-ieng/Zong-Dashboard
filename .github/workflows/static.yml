# Deploy the static dashboard and the workbook attached to each published release
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Download workbook for this release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern Backend.xlsm --dir .
          else
            gh release download --repo "$GITHUB_REPOSITORY" --pattern Backend.xlsm --dir .
          fi
          test -s Backend.xlsm
          sha256sum Backend.xlsm
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
