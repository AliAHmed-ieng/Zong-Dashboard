name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional release tag to deploy; defaults to the latest release
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  trigger_release_deployment:
    if: github.event_name == 'release'
    permissions:
      contents: write
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate the release and queue deployment
        id: queue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="$GITHUB_REF_NAME"
          if [[ ! "$release_tag" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Release tag contains unsupported characters: $release_tag" >&2
            exit 1
          fi
          asset_size="$(gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[] | select(.name == "Backend.xlsm")][0].size // 0')"
          if ! [[ "$asset_size" =~ ^[0-9]+$ ]] || (( asset_size == 0 )); then
            echo "Release $release_tag must include a non-empty asset named exactly Backend.xlsm" >&2
            exit 1
          fi
          git fetch origin main
          git checkout -B pages-deploy origin/main
          printf '%s\n' "$release_tag" > .pages-release-version
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .pages-release-version
          git commit -m "Trigger Pages deployment for release $release_tag"
          git push origin pages-deploy --force
          dispatch_sha="$(git rev-parse HEAD)"
          echo "dispatch_sha=$dispatch_sha" >> "$GITHUB_OUTPUT"
          gh workflow run static.yml --repo "$GITHUB_REPOSITORY" --ref pages-deploy --field release_tag="$release_tag"
      - name: Wait for the Pages deployment result
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_SHA: ${{ steps.queue.outputs.dispatch_sha }}
        run: |
          for attempt in {1..60}; do
            run_id="$(gh run list --workflow static.yml --event workflow_dispatch --branch pages-deploy --limit 50 --repo "$GITHUB_REPOSITORY" --json databaseId,headSha --jq ".[] | select(.headSha == \"$DISPATCH_SHA\") | .databaseId" | head -n 1)"
            if [[ -n "$run_id" ]]; then
              gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status
              exit $?
            fi
            sleep 5
          done
          echo "Timed out waiting for the dispatched Pages workflow to start" >&2
          exit 1

  deploy:
    if: github.event_name != 'release'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Download versioned workbook
        id: backend
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          release_tag="$REQUESTED_RELEASE_TAG"
          if [[ -z "$release_tag" ]]; then
            release_tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          fi
          if [[ ! "$release_tag" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Release tag is missing or contains unsupported characters: $release_tag" >&2
            exit 1
          fi
          asset_size="$(gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[] | select(.name == "Backend.xlsm")][0].size // 0')"
          if ! [[ "$asset_size" =~ ^[0-9]+$ ]] || (( asset_size == 0 )); then
            echo "Release $release_tag must include a non-empty asset named exactly Backend.xlsm" >&2
            exit 1
          fi
          download_dir="$RUNNER_TEMP/backend-download"
          mkdir -p "$download_dir"
          gh release download "$release_tag" --repo "$GITHUB_REPOSITORY" --pattern Backend.xlsm --dir "$download_dir"
          test -s "$download_dir/Backend.xlsm"
          mv "$download_dir/Backend.xlsm" "Backend-$release_tag.xlsm"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          sha256sum "Backend-$release_tag.xlsm"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify deployed workbook
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
          RELEASE_TAG: ${{ steps.backend.outputs.tag }}
        run: |
          url="${PAGES_URL%/}/Backend-${RELEASE_TAG}.xlsm"
          for attempt in {1..12}; do
            status="$(curl -sS -o /dev/null -w '%{http_code}' "$url")"
            if [[ "$status" == "200" ]]; then
              echo "Verified $url"
              exit 0
            fi
            echo "Attempt $attempt: Pages returned HTTP $status; retrying..."
            sleep 10
          done
          echo "Pages did not serve the workbook after deployment: $url" >&2
          exit 1
