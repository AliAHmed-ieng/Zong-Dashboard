          release_tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          gh release download "$release_tag" --repo "$GITHUB_REPOSITORY" --pattern Backend.xlsm --dir .
          test -s Backend.xlsm
          cp Backend.xlsm "Backend-$release_tag.xlsm"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          sha256sum "Backend-$release_tag.xlsm"
